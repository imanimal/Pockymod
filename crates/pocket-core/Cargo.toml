[package]
name = "pocket-core"
description = "Nexus, file and Cyberpunk 2077 logic for Pocket Mods. No UI code, so it can be ported to Linux."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "http2", "charset"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt", "macros"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "apple-native"] }
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "zstd", "time"] }
sevenz-rust2 = { version = "0.20", features = ["deflate", "zstd"] }
unrar = "0.5"
md-5 = "0.10"
hex = "0.4"
same-file = "1"
walkdir = "2"
roxmltree = "0.20"
pelite = { version = "0.10", default-features = false, features = ["std", "mmap"] }
rusty-leveldb = "4.0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
