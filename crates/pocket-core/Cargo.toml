[package]
name = "pocket-core"
description = "Nexus, file and Cyberpunk logic for Pocket Mods, free of any UI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
log = "0.4.35"
md-5 = "0.11.0"
pelite = "0.10.0"
reqwest = { version = "0.13.5", features = ["json", "stream", "gzip", "native-tls", "http2", "charset", "system-proxy", "form", "query"], default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.24.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "process", "sync", "time"] }
unrar = "0.5.8"
url = "2.5.8"
walkdir = "2.5.0"
zip = "9.3.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_Storage_FileSystem"] }
winreg = "0.56.0"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["net", "macros", "rt-multi-thread"] }
tempfile = "3.27.0"
