[package]
name = "pocket-core"
description = "Nexus, file and Cyberpunk 2077 logic for Pocket Mods. No UI code, so it can be ported to Linux."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "http2", "charset"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt", "macros"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust", "apple-native"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
