name: CI

# Runs on pull requests, and by hand from the Actions tab (pick a branch).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Marketplace packages
        run: node scripts/validate-marketplace.mjs
      - run: cargo test -p pocket-core
      - run: cargo build -p pocket-mods

  windows:
    name: Tests and installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # hard links, backups and rollback on NTFS, the registry code and version reading
      - run: cargo test -p pocket-core
      - name: Build the installer (unsigned)
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-mods-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
