<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:; frame-src 'none'; child-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Panel</title>
<script>
// A panel runs only as a frame of the Add-ons screen. Opened as a page of its own it stops here, before any of the
// extension's code: as a top-level page it could otherwise reach the window it was opened in.
if (window.top === window.self) { window.stop(); document.documentElement.innerHTML = ""; throw new Error("A panel opens only inside Pockymod."); }
// No peer-to-peer connections either (WebRTC could reach the network past the CSP).
for (const k of ["RTCPeerConnection", "webkitRTCPeerConnection", "RTCDataChannel", "RTCSessionDescription", "RTCIceCandidate"]) {
  try { Object.defineProperty(window, k, { value: undefined, writable: false, configurable: false }); } catch (_) { /* not there */ }
}
// frames the panel makes would bring fresh copies of what was removed above: no frames
try {
  const desc = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "contentWindow");
  Object.defineProperty(HTMLIFrameElement.prototype, "contentWindow", { get() { return null; }, configurable: false });
  Object.defineProperty(HTMLIFrameElement.prototype, "contentDocument", { get() { return null; }, configurable: false });
  void desc;
} catch (_) { /* older engines */ }
</script>
<style>
/* The panel's page. The app sends its colours on start and whenever the theme changes (see docs/extensions.md). */
:root {
  --bg: #e6e2d8; --bg2: #fbf9f4; --surface: #f6f3ec; --surface-2: #ebe7dd; --line: #d3ccbd;
  --text: #1b1915; --text-2: #4a453c; --text-3: #6a645a; --accent: #ff5b1f; --on-accent: #1b1915;
  --chrome-bg: #2a2722; --chrome-fg: #f6f3ec; --disp-bg: #b1bd93; --disp-fg: #1f2a17;
  --ok: #2e7d32; --warn: #9a5b00; --bad: #c8341b; --acc2: #2f6fde;
  --font-body: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.45 var(--font-body); color: var(--text-2); background: var(--surface); padding: 14px 16px 24px; }
h1, h2, h3 { color: var(--text); margin: 0 0 .45em; letter-spacing: -.01em; }
h1 { font-size: 1.3em; } h2 { font-size: 1.1em; } h3 { font-size: 1em; }
p { margin: 0 0 .6em; }
a { color: var(--acc2); }
button { font: inherit; font-size: .92em; font-weight: 600; color: var(--text); cursor: pointer; border: 0; border-radius: 9px; padding: .42em .85em; margin-bottom: 3px;
  background: var(--surface-2); box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 75%, #000), 0 3px 0 color-mix(in srgb, var(--line) 55%, #000); }
button:active { transform: translateY(3px); box-shadow: 0 0 0 1px color-mix(in srgb, var(--line) 75%, #000); }
button.primary { background: var(--accent); color: var(--on-accent); }
button.ghost { background: transparent; box-shadow: none; color: var(--text-2); }
button[disabled] { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); width: 1.05em; height: 1.05em; }
input, select, textarea { font: inherit; font-size: .92em; color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: .38em .55em; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .4em .5em; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .74em; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text-3); }
td { color: var(--text); }
code, .mono { font-family: var(--font-mono); font-size: .9em; }
code { background: var(--surface-2); padding: .05em .35em; border-radius: 4px; }
.dim { color: var(--text-3); }
.row { display: flex; align-items: center; gap: .5em; flex-wrap: wrap; }
.lcd { display: inline-flex; flex-direction: column; padding: .45em .7em; border-radius: 6px; background: var(--disp-bg); color: var(--disp-fg);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, .28), 0 0 0 3px var(--chrome-bg); margin: 4px; font-family: var(--font-mono); }
.lcd b { font-size: 1.5em; line-height: 1.1; }
.lcd span { font-size: .7em; text-transform: uppercase; letter-spacing: .08em; }
.card { background: var(--bg2); border-radius: 10px; padding: .7em .85em; box-shadow: 0 0 0 1px var(--line); }
</style>
<script>
// The bridge to the app. A panel has no other way out: no network, no app internals. Each call is checked against
// the permissions the extension declared and the user approved.
(() => {
  "use strict";
  const app = window.parent;
  let next = 1;
  const waiting = new Map();
  const handlers = new Map();
  const send = (method, params) => new Promise((resolve, reject) => {
    const id = next++;
    waiting.set(id, { resolve, reject });
    app.postMessage({ pocket: 1, id, method: String(method), params: params === undefined ? null : params }, "*");
  });
  const applyTheme = (t) => {
    if (!t || typeof t !== "object") return;
    const root = document.documentElement;
    for (const [k, v] of Object.entries(t.tokens || {})) if (/^--[a-z0-9-]+$/.test(k) && typeof v === "string") root.style.setProperty(k, v);
    if (t.scheme) { root.dataset.scheme = t.scheme; root.style.colorScheme = t.scheme; }
  };
  window.addEventListener("message", (e) => {
    if (e.source !== app) return;
    const m = e.data;
    if (!m || m.pocket !== 1) return;
    if (typeof m.event === "string") {
      if (m.event === "theme") applyTheme(m.data);
      for (const fn of handlers.get(m.event) || []) { try { fn(m.data); } catch (err) { console.error(err); } }
      return;
    }
    const w = waiting.get(m.id);
    if (!w) return;
    waiting.delete(m.id);
    if (typeof m.error === "string") w.reject(new Error(m.error)); else w.resolve(m.result);
  });
  // say hello until the app answers (it may still be setting up the frame)
  const hello = new Promise((resolve) => {
    let done = false, tries = 0;
    const ask = () => {
      if (done || tries++ > 20) return;
      send("hello").then((info) => { if (!done) { done = true; applyTheme(info && info.theme); resolve(info); } }, () => {});
      setTimeout(ask, 500);
    };
    ask();
  });
  const pocket = {
    call: send,
    on: (event, fn) => { handlers.set(event, [...(handlers.get(event) || []), fn]); },
    ready: hello,
    library: { list: () => send("library.list"), setEnabled: (id, on) => send("library.setEnabled", { id, on: !!on }) },
    nexus: { search: (query) => send("nexus.search", query || {}), open: (modId) => send("nexus.open", { modId }) },
    queue: { add: (modId, fileId) => send("queue.add", { modId, fileId: fileId ?? null }) },
    toast: (text) => send("toast", { text: String(text) }),
    storage: {
      get: (key) => send("storage.get", { key }), set: (key, value) => send("storage.set", { key, value }),
      remove: (key) => send("storage.remove", { key }), keys: () => send("storage.keys"),
    },
  };
  Object.freeze(pocket.library); Object.freeze(pocket.nexus); Object.freeze(pocket.queue); Object.freeze(pocket.storage);
  window.pocket = Object.freeze(pocket);
})();
</script>
</head>
<body>
<!--PANEL-->
</body>
</html>
