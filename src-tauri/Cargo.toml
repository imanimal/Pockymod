[package]
name = "pocket-mods"
description = "Pocket Mods: a Cyberpunk 2077 mod manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pocket_mods_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.4"

[dependencies]
log = "0.4.35"
pocket-core = { version = "0.1.0", path = "../crates/pocket-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time"] }
